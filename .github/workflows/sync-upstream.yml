# Keeps the sync workflow registered in GitHub Actions.
name: Sync upstream repository

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-upstream-main
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      BITBUCKET_TOKEN: ${{ secrets.BITBUCKET_TOKEN }}
      CODEBERG_TOKEN: ${{ secrets.CODEBERG_TOKEN }}
      GITEA_TOKEN: ${{ secrets.GITEA_TOKEN }}
      MOSHUB_TOKEN: ${{ secrets.MOSHUB_TOKEN }}
    steps:
      - name: Checkout destination
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Clone upstream
        run: |
          git clone --depth 1 --branch main https://github.com/t1murmat/Vice-City-Theme-Preservation.git /tmp/upstream

      - name: Synchronize files
        run: |
          rsync -a --delete \
            --exclude='/.git/' \
            --exclude='/.github/workflows/sync-upstream.yml' \
            /tmp/upstream/ ./

      - name: Commit and push changes
        run: |
          if [[ -z "$(git status --porcelain)" ]]; then
            echo "No upstream changes detected."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: sync from Vice-City-Theme-Preservation"
          git push origin HEAD:main

      - name: Push synchronized commit to Bitbucket
        if: ${{ env.BITBUCKET_TOKEN != '' }}
        run: |
          git remote add bitbucket "https://x-token-auth:${BITBUCKET_TOKEN}@bitbucket.org/maginster/gta-vi-theme-discord.git"
          git push bitbucket HEAD:main

      - name: Push synchronized commit to Codeberg
        if: ${{ env.CODEBERG_TOKEN != '' }}
        run: |
          git remote add codeberg "https://MAGINSTER:${CODEBERG_TOKEN}@codeberg.org/MAGINSTER/GTA-VI-Themes-Discord.git"
          git push codeberg HEAD:main

      - name: Push synchronized commit to Gitea
        if: ${{ env.GITEA_TOKEN != '' }}
        run: |
          git remote add gitea "https://MAGINSTER:${GITEA_TOKEN}@gitea.com/MAGINSTER/GTA-VI-Theme-Discord.git"
          git push gitea HEAD:main

      - name: Push synchronized commit to MosHub
        if: ${{ env.MOSHUB_TOKEN != '' }}
        run: |
          git remote add moshub "https://oauth2:${MOSHUB_TOKEN}@hub.mos.ru/MAGINSTER/GTA-VI-Theme-Discord.git"
          git push moshub HEAD:main

      - name: Explain missing MosHub token
        if: ${{ env.MOSHUB_TOKEN == '' }}
        run: |
          echo "MosHub push skipped: add MOSHUB_TOKEN in repository Actions secrets."

      - name: Explain missing Gitea token
        if: ${{ env.GITEA_TOKEN == '' }}
        run: |
          echo "Gitea push skipped: add GITEA_TOKEN in repository Actions secrets."

      - name: Explain missing Codeberg token
        if: ${{ env.CODEBERG_TOKEN == '' }}
        run: |
          echo "Codeberg push skipped: add CODEBERG_TOKEN in repository Actions secrets."

      - name: Explain missing Bitbucket token
        if: ${{ env.BITBUCKET_TOKEN == '' }}
        run: |
          echo "Bitbucket push skipped: add BITBUCKET_TOKEN in repository Actions secrets."
