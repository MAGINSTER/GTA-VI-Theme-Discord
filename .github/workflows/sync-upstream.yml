name: Sync upstream repository

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-upstream-main
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout destination
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Clone upstream
        run: |
          git clone --depth 1 --branch main https://github.com/t1murmat/Vice-City-Theme-Preservation.git /tmp/upstream

      - name: Synchronize files
        run: |
          rsync -a --delete \
            --exclude='/.git/' \
            --exclude='/.github/workflows/sync-upstream.yml' \
            /tmp/upstream/ ./

      - name: Commit and push changes
        run: |
          if [[ -z "$(git status --porcelain)" ]]; then
            echo "No upstream changes detected."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: sync from Vice-City-Theme-Preservation"
          git push origin HEAD:main
